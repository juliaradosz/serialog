async function rerender() { const y = scrollY; await render(); scrollTo(0, y); }
async function render() {
  const token = ++renderToken;
  if (mode === 'local') return renderInfo('Uruchom aplikację przez start.bat', 'Aplikacja potrzebuje serwera (konta i polska baza filmów). Kliknij dwa razy plik <b>start.bat</b> w folderze aplikacji — otworzy się adres http://localhost:8000.');
  if (!user) return renderLogin();
  if (!hasTmdb) return renderInfo('Brak klucza TMDB', 'Wklej klucz API z themoviedb.org do pliku <b>tmdb_klucz.txt</b> w folderze aplikacji i uruchom ponownie start.bat.');
  document.body.classList.remove('auth');
  const [, page = 'shows-search', arg] = location.hash.split('/');
  const tab = page.startsWith('show') ? 'shows' : page.startsWith('movie') ? 'movies' : page.startsWith('cinema') ? 'cinema' : ['towatch', 'calendar'].includes(page) ? 'upcoming' : ['stats', 'lib', 'friend', 'friends'].includes(page) ? 'profile' : page;
  const subPage = ['show', 'movie', 'person', 'lib', 'friend', 'friends', 'stats', 'calendar', 'shows-list', 'movies-list'].includes(page);
  $('.hdback').hidden = !subPage; document.body.classList.toggle('subpage', subPage);
  document.querySelectorAll('.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  const nS = Object.keys(state.shows).length, nM = Object.keys(state.movies).length;
  $('#count').textContent = [nS && plural(nS, 'serial', 'seriale', 'seriali'), nM && plural(nM, 'film', 'filmy', 'filmów')].filter(Boolean).join(' · ');
  try {
    switch (page) {
      case 'show': return await renderShow(+arg, token);
      case 'shows-search': return await renderSearch(token, 'tv');
      case 'shows-genres': return renderGenres('tv');
      case 'shows-list': return await renderList('tv', arg, token);
      case 'movie': return await renderMovie(+arg, token);
      case 'person': return await renderPerson(+arg, token);
      case 'movies': case 'movies-seen': return renderMovies(page === 'movies-seen' ? 'seen' : 'watch');
      case 'movies-search': return await renderSearch(token, 'movie');
      case 'movies-genres': return renderGenres('movie');
      case 'movies-list': return await renderList('movie', arg, token);
      case 'cinema': case 'cinema-now': case 'cinema-soon': return await renderCinema(token, page === 'cinema-soon' ? 'soon' : 'now');
      case 'foryou': return await renderForYou(token);
      case 'upcoming': return await renderUpcoming(token);
      case 'towatch': return await renderToWatch(token);
      case 'profile': return await renderProfile(token);
      case 'stats': await loadFollowed(); return renderStats();
      case 'lib': return await renderLib(arg, token);
      case 'friend': return await renderFriend(decodeURIComponent(arg || ''), token);
      case 'friends': return await renderFriends(token, arg);
      case 'calendar': return await renderCalendar(token);
      default: return await renderWatch(token);
    }
  } catch (e) {
    if (token === renderToken) view.innerHTML = `<div class="empty"><b>Coś poszło nie tak</b>${esc(e.message)}<br><br><button class="btn ghost" onclick="render()">Spróbuj ponownie</button></div>`;
  }
}

function tile(kind, x) {
  const title = kind === 'tv' ? x.name : x.title, date = kind === 'tv' ? x.first_air_date : x.release_date;
  const future = date && date > todayStr();
  let on, sym, act, open;
  if (kind === 'tv') { on = !!state.shows[x.id]; sym = on ? '✓' : '+'; act = 'follow'; open = 'open'; }
  else { const s = state.movies[x.id] && state.movies[x.id].status; on = !!s; sym = s === 'seen' ? '👁' : s ? '✓' : '+'; act = 'mList'; open = 'mOpen'; }
  return `<div class="tile" data-act="${open}" data-id="${x.id}">
    ${poster(img(x.poster_path), title)}
    <button class="badge ${on ? 'on' : ''}" data-act="${act}" data-id="${x.id}" title="${on ? 'Na liście' : kind === 'tv' ? 'Dodaj do moich seriali' : 'Chcę obejrzeć'}">${sym}</button>

// profil gustu: które gatunki lubisz (oglądane, wysoko ocenione, ulubione, oglądane ponownie), a których nie (przerwane, „nie podoba mi się”, nisko ocenione)
function tasteProfile() {
  const perShow = {};
  Object.values(state.watched).forEach(w => perShow[w.s] = (perShow[w.s] || 0) + 1 + (w.rw || []).length);
  const g = { tv: {}, movie: {} }, add = (kind, names, v) => (names || []).forEach(n => g[kind][n] = (g[kind][n] || 0) + v);
  Object.values(state.shows).forEach(s => add('tv', s.genres, s.dropped ? -1.5 : .4 + Math.log2(1 + (perShow[s.id] || 0)) * .5 + (s.rating ? (s.rating - 3) * .7 : 0) + (state.favs['tv:' + s.id] ? 1.5 : 0)));
  Object.values(state.movies).forEach(m => add('movie', m.genres, (m.status === 'seen' ? 1 : .5) + (m.rating ? (m.rating - 3) * .7 : 0) + (state.favs['movie:' + m.id] ? 1.5 : 0) + (m.rw || []).length * .5));
  Object.values(disliked()).forEach(d => add(d.type, d.genres, -2));
  ['tv', 'movie'].forEach(k => { const max = Math.max(1, ...Object.values(g[k]).map(Math.abs)); Object.keys(g[k]).forEach(n => g[k][n] /= max); });
  return g;
}
// jak bardzo tytuł pasuje do Twoich gatunków: od -1 (same nielubiane) do 1 (same ulubione)
const genreFit = (taste, kind, x) => { const ids = x.genre_ids || (x.genres || []).map(g => g.id); if (!ids.length) return 0; return ids.reduce((a, id) => a + (taste[kind][genres[kind][id]] || 0), 0) / ids.length; };
// ocena widzów: dobre filmy w górę, mało znane i słabe w dół
const quality = x => (x.vote_count || 0) < 30 ? -.6 : Math.max(-.7, Math.min(.6, ((x.vote_average || 0) - 6.8) * .35));
async function buildForYou() {
  const r = rng(Math.floor(Math.random() * 233280));
  const taste = tasteProfile();
  const perShow = {};
  Object.values(state.watched).forEach(w => perShow[w.s] = (perShow[w.s] || 0) + 1 + (w.rw || []).length);
  // „ziarna” — Twoje tytuły; im bardziej Ci się podobały, tym większa waga (przerwane i nisko ocenione pomijamy)
  const seeds = [];
  Object.values(state.shows).forEach(s => {
    if (s.dropped || (s.rating && s.rating <= 2)) return;
    seeds.push({ kind: 'tv', id: s.id, title: s.name, w: Math.max(.3, .6 + Math.log2(1 + (perShow[s.id] || 0)) * .6 + (s.rating ? (s.rating - 3) * .8 : 0) + (state.favs['tv:' + s.id] ? 2 : 0)) });
  });
  Object.values(state.movies).forEach(m => {
    if (m.rating && m.rating <= 2) return;
    seeds.push({ kind: 'movie', id: m.id, title: m.title, w: Math.max(.3, (m.status === 'seen' ? 1.6 : .8) + (m.rating ? (m.rating - 3) * .8 : 0) + (state.favs['movie:' + m.id] ? 2 : 0) + (m.rw || []).length * .5) });
  });
  // losowanie ważone — przy „Inne propozycje” inne ziarna, ale ulubione wypadają najczęściej
  // osobno dla seriali i filmów, do 12 tytułów każdego rodzaju (wagi spłaszczone, żeby kilka ulubionych nie zabrało wszystkich miejsc)
  const picked = [];
  ['tv', 'movie'].forEach(kind => {
    const pool = seeds.filter(s => s.kind === kind).map(s => ({ ...s, pw: Math.sqrt(s.w) }));
    for (let n = 0; n < 12 && pool.length; n++) {
      const total = pool.reduce((a, s) => a + s.pw, 0);
      let x = r() * total, i = 0;
      while (x > pool[i].pw && i < pool.length - 1) x -= pool[i++].pw;
      picked.push(pool.splice(i, 1)[0]);
    }
  });
  const cand = {};
  const add = (kind, x, score, why) => {
    if (!x.poster_path || inLibrary(kind, x.id) || blocked(kind, x)) return;
    const c = cand[kind + ':' + x.id] ||= { kind, x, score: 0, why: new Set(), by: {} };
    c.score += score; if (why) { c.why.add(why); c.by[why] = (c.by[why] || 0) + score; }
  };
  await Promise.all(picked.map(async s => {
    const page = 1 + Math.floor(r() * 2);
    const res = await tmdb(`${s.kind}/${s.id}/recommendations`, { page }).catch(() => ({ results: [] }));
    (res.results || []).forEach((x, i) => add(s.kind, x, s.w * (1 - i / 40), s.title));
  }));
  // najbardziej lubiany gatunek (wg profilu gustu) — dodatkowe, mniej oczywiste propozycje
  const topGenre = kind => {
    const best = Object.entries(taste[kind]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 2);
    const name = best[Math.floor(r() * best.length)];
    const id = name && Object.keys(genres[kind]).find(k => genres[kind][k] === name[0]);
    return id ? { id, name: name[0] } : null;
  };
  const topG = { tv: topGenre('tv'), movie: topGenre('movie') };
  await Promise.all(['tv', 'movie'].map(async kind => {
    const g = topG[kind];
    if (!g) return;
    const res = await tmdb(`discover/${kind}`, { with_genres: g.id, sort_by: 'popularity.desc', 'vote_count.gte': kind === 'movie' ? 300 : 50, page: 1 + Math.floor(r() * 8) }).catch(() => ({ results: [] }));
    (res.results || []).forEach(x => add(kind, x, .6, `gatunek: ${g.name}`));
  }));
  // wynik = podobieństwo do Twoich tytułów (więcej, gdy pasuje do kilku naraz) + dopasowanie do gatunków + ocena widzów + odrobina losowości
  const rank = kind => {
    const list = Object.values(cand).filter(c => c.kind === kind)
      .map(c => ({ ...c, fit: genreFit(taste, kind, c.x), s: c.score + 1.4 * genreFit(taste, kind, c.x) + quality(c.x) + r() * .35 }))
      .filter(c => c.fit > -.5).sort((a, b) => b.s - a.s);
    // mieszanie: na zmianę po jednej najlepszej propozycji od każdego Twojego tytułu (a nie kilkanaście „bo: ten sam tytuł” pod rząd)
    const groups = new Map();
    list.forEach(c => { const k = (Object.entries(c.by).sort((a, b) => b[1] - a[1])[0] || [''])[0]; groups.has(k) ? groups.get(k).push(c) : groups.set(k, [c]); });
    const qs = [...groups.values()], out = [];
    while (out.length < 40 && qs.some(q => q.length)) qs.forEach(q => { if (q.length && out.length < 40) out.push(q.shift()); });
    return out;
  };
  Object.values(cand).forEach(c => seen[c.kind][c.x.id] = c.x);
  return { tv: rank('tv'), movie: rank('movie'), allSeeds: shuffled(seeds.sort((a, b) => b.w - a.w).slice(0, 30), 3), topG, taste, cursor: {}, pages: {}, loading: false };
}
let fyKind = 'tv';  // zakładka w „Dla Ciebie” (przełączana bez przeładowania propozycji)
async function renderForYou(token) {
  const head = `<div class="sub"><a data-act="fyTab" data-k="tv" class="${fyKind === 'tv' ? 'on' : ''}">Seriale</a><a data-act="fyTab" data-k="movie" class="${fyKind === 'movie' ? 'on' : ''}">Filmy</a></div>`;
  const nS = Object.keys(state.shows).length, nM = Object.keys(state.movies).length;
  if (!nS && !nM) { view.innerHTML = head + emptyBox('Dodaj kilka tytułów', 'Propozycje powstają na podstawie seriali i filmów, które oglądasz, oceniasz i odkładasz na później.', '#/shows-search', 'Szukaj seriali'); return; }
  // propozycje liczone raz na wizytę — dodanie tytułu nie przeładowuje listy ani nie przewija ekranu
  if (!forYou) {
    view.innerHTML = head + '<div class="loading">Analizuję Twoje seriale i filmy…</div>';
    forYou = await (forYouP ||= buildForYou().finally(() => { forYouP = null; }));  // jedno liczenie naraz
    if (token !== renderToken) return;

  view.innerHTML = head + `<div class="fy-head"><div class="muted small">${isTv ? 'Seriale' : 'Filmy'} podobne do tytułów z Twojej listy (najbardziej liczą się ulubione, wysoko ocenione i oglądane ponownie), dopasowane do Twoich ulubionych gatunków i dobrze oceniane przez widzów. Przerwane i 👎 sprawiają, że podobne się nie pojawiają.${hidden ? ` <a class="link" href="#/${isTv ? 'shows' : 'movies'}-genres">Ukryte gatunki: ${hidden}</a>` : ''}</div>
    <button class="btn ghost sm" data-act="forYouRefresh">↻ Inne propozycje</button></div>

// dodane tytuły zostają na swoim miejscu (z ✓), żeby siatka nie przesuwała się pod palcem
const fyTile = (kind, c) => tile(kind, c.x).replace(/<\/div>\s*$/, `<button class="tno" data-act="dislike" data-kind="${kind}" data-id="${c.x.id}" title="Nie podoba mi się">👎</button><div class="why" title="Bo: ${esc([...c.why].join(', '))}">bo: ${esc([...c.why].slice(0, 2).join(', ') || 'popularne')}</div></div>`);
// kolejne propozycje bez końca: następne strony rekomendacji dla kolejnych tytułów z listy + popularne z ulubionego gatunku
async function forYouMore(kind) {
  const f = forYou;
  if (!f || f.loading) return [];
  f.loading = true;
  const shown = new Set(f[kind].map(c => c.x.id)), fresh = [];
  const take = (x, why) => { if (!x.poster_path || inLibrary(kind, x.id) || blocked(kind, x) || shown.has(x.id)) return; shown.add(x.id); seen[kind][x.id] = x; fresh.push({ kind, x, score: 0, why: new Set(why ? [why] : []) }); };
  const seeds = f.allSeeds.filter(s => s.kind === kind);
  await Promise.all([0, 1, 2].map(async () => {
    if (!seeds.length) return;
    const s = seeds[(f.cursor[kind] = (f.cursor[kind] || 0) + 1) % seeds.length];
    const page = (f.pages[kind + s.id] = (f.pages[kind + s.id] || 0) + 1);
    if (page > 5) return;
    const res = await tmdb(`${kind}/${s.id}/recommendations`, { page }).catch(() => ({ results: [] }));
    (res.results || []).forEach(x => take(x, s.title));
  }));
  const g = f.topG[kind], gp = (f.pages['g' + kind] = (f.pages['g' + kind] || 0) + 1);
  const res = await tmdb(`discover/${kind}`, { ...(g ? { with_genres: g.id } : {}), sort_by: 'popularity.desc', 'vote_count.gte': kind === 'movie' ? 200 : 30, page: Math.min(gp, 500) }).catch(() => ({ results: [] }));
  (res.results || []).forEach(x => take(x, g ? `gatunek: ${g.name}` : 'popularne'));
  const out = fresh.map(c => ({ ...c, s: 1.4 * genreFit(f.taste, kind, c.x) + quality(c.x) + Math.random() * .35 })).filter(c => genreFit(f.taste, kind, c.x) > -.5).sort((a, b) => b.s - a.s);
  f[kind].push(...out);
  f.loading = false;
  return out;
}
async function loadMoreFY() {
  if (!forYou || forYou.loading) return;
  const kind = fyKind, fresh = await forYouMore(kind), grid = $('#fyGrid');
  if (grid && kind === fyKind) grid.insertAdjacentHTML('beforeend', fresh.map(c => fyTile(kind, c)).join(''));

let listLoading = false;
const listObserver = 'IntersectionObserver' in window ? new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) loadMoreList(); }, { rootMargin: '800px' }) : null;
function watchSentinel() {
  if (listObserver) { listObserver.disconnect(); const s = $('#sentinel'); if (s) listObserver.observe(s); }
  setTimeout(checkSentinel, 50);
}
// zapasowo: sprawdzanie przy przewijaniu (gdy przeglądarka nie zgłosi widoczności)
function checkSentinel() {
  const s = $('#sentinel'); if (s && s.getBoundingClientRect().top < innerHeight + 800) loadMoreList();
  const f = $('#feedSentinel'); if (f && f.getBoundingClientRect().top < innerHeight + 800) loadMoreFeed();
  const y = $('#fySentinel'); if (y && y.getBoundingClientRect().top < innerHeight + 800) loadMoreFY();
}
let scrollTick = null;
window.addEventListener('scroll', () => { if (scrollTick) return; scrollTick = setTimeout(() => { scrollTick = null; checkSentinel(); }, 150); }, { passive: true });
async function loadMoreList() {
  if (listLoading || !listView || listView.page >= listView.pages) return;
  listLoading = true;
  try {
    const res = await fetchList(listView.kind, listConfig(listView.kind, listView.key), listView.page + 1);
    const ids = new Set(listView.items.map(x => x.id));
    listView.items.push(...res.items.filter(x => !ids.has(x.id)));
    listView.page = res.page;
  } catch (e) { listView.pages = listView.page; }
  listLoading = false;
  rerender();
}

        <div class="pcount"><span><b>${tv.length}</b> seriali</span><span><b>${movies.length}</b> filmów</span></div>

let feed = null;
const feeds = { tv: null, movie: null };  // propozycje zostają po powrocie z serialu/filmu
async function feedMore() {

  feed.loading = true;

async function getJSON(url) {

}
const WIKI_API = 'https://pl.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*';
const wikiClean = s => s.replace(/<!--[\s\S]*?-->/g, '').replace(/<ref[^>]*\/>/g, '').replace(/<ref[\s\S]*?<\/ref>/g, '')
  .replace(/\[\[(?:[^|\]]*\|)?([^\]]*)\]\]/g, '$1').replace(/\{\{[^{}]*\}\}/g, '').replace(/<br\s*\/?>/g, ', ').replace(/'{2,}/g, '').replace(/<[^>]+>/g, '').trim();
async function wikiArticle(s) {
  // 1) przez Wikidata (identyfikator TMDB lub IMDb), 2) wyszukiwarka Wikipedii + zgodny rok premiery

  let qid = ex.wikidata_id;
  for (const q of [`haswbstatement:P4983=${s.id}`, ex.imdb_id && `haswbstatement:P345=${ex.imdb_id}`].filter(Boolean)) {
    if (qid) break;
    const r = await getJSON(`https://www.wikidata.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srprop=&format=json&origin=*`).catch(() => null);
    qid = r && r.query.search[0] && r.query.search[0].title;
  }
  if (qid) {
    const r = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=sitelinks&sitefilter=plwiki&format=json&origin=*`).catch(() => null);
    const sl = r && r.entities[qid] && r.entities[qid].sitelinks.plwiki;
    if (sl) return sl.title;
  }
  const names = [...new Set([s.name, s.original_name].filter(Boolean))];
  for (const n of names) {
    const r = await getJSON(`${WIKI_API}&action=query&list=search&srlimit=4&srprop=&srsearch=${encodeURIComponent(`intitle:"${n}"`)}`).catch(() => null);
    for (const hit of (r && r.query.search) || []) {
      const box = await wikiInfobox(hit.title);
      if (box && box.year && s.first_air_date && box.year === +s.first_air_date.slice(0, 4)) return hit.title;
    }
  }

}

// angielski opis tylko gdy brak polskiego (doładowywany w tle)

  const aired = d.episodes.filter(counts), done = aired.filter(e => state.watched[e.key]).length;
  const future = d.episodes.some(e => e.air && !isAired(e)) || !!showNextDate(d);
  const ended = ['Ended', 'Canceled'].includes(d.show.status) && !future;
  const left = aired.filter(e => !state.watched[e.key]);
  const runtime = d.show.episode_run_time && d.show.episode_run_time[0];
  const leftMin = left.reduce((a, e) => a + (e.runtime || runtime || 0), 0);
  const st = isDropped(d.show.id) ? 'dropped' : !aired.length ? 'none' : done === aired.length ? (ended ? 'finished' : 'current') : done ? 'progress' : 'start';
  return { aired: aired.length, done, left: left.length, leftMin, pct: aired.length ? Math.round(done / aired.length * 100) : 0, st, ended };

    progress: [`Obejrzane ${p.pct}%`, `Zostało ${plural(p.left, 'odcinek', 'odcinki', 'odcinków')}${p.leftMin ? ' · ' + fmtLeft(p.leftMin) : ''}`],
    start: ['Jeszcze nie zaczęte', `${plural(p.aired, 'odcinek', 'odcinki', 'odcinków')} do obejrzenia${p.leftMin ? ' · ' + fmtLeft(p.leftMin) : ''}`],
    dropped: ['Oglądanie przerwane', `Obejrzane ${p.done} z ${p.aired} odcinków`],
    none: ['Brak wyemitowanych odcinków', nd ? `${nd.label} — ${dayWord(nd.date)}` : 'Premiera nie jest jeszcze znana.'],

    <div class="pc-top"><span class="pc-ico">${icon}</span><div class="pc-txt"><b>${text[0]}</b><small>${esc(text[1])}</small></div><span class="pc-num">${p.done}<i>/${p.aired}</i></span></div>

// ---------- statystyki (osobna strona z Profilu) ----------
let statsYear = null, statsMonth = null;
const MONTHS = ['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'];
const MONTHS_FULL = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec', 'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];
// czas w czytelnej formie: „3 dni 4 godz.” / „5 godz. 20 min”
function fmtDur(min) {
  min = Math.round(min || 0);
  const d = Math.floor(min / 1440), h = Math.floor(min % 1440 / 60), m = min % 60;
  if (d) return `${plural(d, 'dzień', 'dni', 'dni')} ${h} godz.`;
  if (h) return `${h} godz. ${m} min`;
  return `${m} min`;
}
function renderStats() {
  // każde obejrzenie liczy się osobno — także powtórki (z datą, kiedy oglądano)
  const eps = Object.values(state.watched).filter(w => w.t).flatMap(w => [w, ...(w.rw || []).map(t => ({ ...w, t }))]);
  const films = Object.values(state.movies).filter(m => m.status === 'seen' && m.seenAt).flatMap(m => [m, ...(m.rw || []).map(t => ({ ...m, seenAt: t }))]);
  const tvMin = eps.reduce((a, w) => a + (w.m || 0), 0), mvMin = films.reduce((a, m) => a + (m.runtime || 0), 0);
  const years = [...new Set([...eps.map(w => new Date(w.t).getFullYear()), ...films.map(m => new Date(m.seenAt).getFullYear())])].sort((a, b) => b - a);
  const nowY = new Date().getFullYear();
  if (!years.includes(statsYear)) statsYear = years.includes(nowY) ? nowY : years[0] || nowY;
  const inYear = t => new Date(t).getFullYear() === statsYear;
  const yEps = eps.filter(w => inYear(w.t)), yFilms = films.filter(m => inYear(m.seenAt));
  const per = list => { const a = Array(12).fill(0); list.forEach(t => a[new Date(t).getMonth()]++); return a; };
  const perMin = (list, get) => { const a = Array(12).fill(0); list.forEach(x => a[new Date(x.t).getMonth()] += get(x)); return a; };
  const epM = per(yEps.map(w => w.t)), mvM = per(yFilms.map(m => m.seenAt));
  const epMin = perMin(yEps, w => w.m || 0), mvMinM = perMin(yFilms.map(m => ({ t: m.seenAt, r: m.runtime })), x => x.r || 0);
  const curM = statsYear === nowY ? new Date().getMonth() : 11;
  const byShow = {};
  yEps.forEach(w => byShow[w.s] = (byShow[w.s] || 0) + 1);
  const top = Object.entries(byShow).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const showName = id => (state.shows[id] && state.shows[id].name) || (showCache[id] && showCache[id].show.name) || 'Serial';
  const finished = Object.keys(state.shows).filter(id => showCache[id] && progressState(showCache[id]).st === 'finished').length;

  // wykres słupkowy jednej serii (każdy wykres ma własną skalę — bez dwóch osi)
  const chart = (vals, cls, unit) => {
    const max = Math.max(...vals, 1);
    return `<div class="chart ${cls}">
      <div class="ch-max">${unit(Math.max(...vals))}</div>
      <div class="ch-bars">${vals.map((v, i) => `<button class="ch-col ${statsMonth === i ? 'sel' : ''} ${statsYear === nowY && i > curM ? 'future' : ''}" data-act="statMonth" data-m="${i}"
          title="${MONTHS_FULL[i]} ${statsYear}: ${unit(v)}" aria-label="${MONTHS_FULL[i]}: ${unit(v)}">
          <span class="ch-bar" style="height:${v ? Math.max(4, v / max * 100) : 0}%"></span><span class="ch-lbl">${MONTHS[i]}</span></button>`).join('')}</div>
    </div>`;
  };
  const sel = statsMonth != null ? `<div class="ch-info"><b>${MONTHS_FULL[statsMonth]} ${statsYear}</b>
      <span><i class="dot tv"></i>${plural(epM[statsMonth], 'odcinek', 'odcinki', 'odcinków')} · ${fmtDur(epMin[statsMonth])}</span>
      <span><i class="dot mv"></i>${plural(mvM[statsMonth], 'film', 'filmy', 'filmów')} · ${fmtDur(mvMinM[statsMonth])}</span></div>`
    : '<div class="ch-info muted small">Stuknij miesiąc na wykresie, żeby zobaczyć szczegóły.</div>';

  view.innerHTML = `
    <div class="sthead"><a class="back2" href="#/profile">‹ Profil</a><h2>Statystyki</h2></div>
    <div class="tcards">
      <div class="tcard tv"><small>Seriale</small><b>${fmtDur(tvMin)}</b><span>${plural(eps.length, 'odcinek', 'odcinki', 'odcinków')}${eps.length - Object.values(state.watched).filter(w => w.t).length ? ` · w tym ↻ ${eps.length - Object.values(state.watched).filter(w => w.t).length} ponownie` : ''}</span></div>
      <div class="tcard mv"><small>Filmy</small><b>${fmtDur(mvMin)}</b><span>${plural(films.length, 'film', 'filmy', 'filmów')}${films.length - Object.values(state.movies).filter(m => m.status === 'seen' && m.seenAt).length ? ` · w tym ↻ ${films.length - Object.values(state.movies).filter(m => m.status === 'seen' && m.seenAt).length} ponownie` : ''}</span></div>
      <div class="tcard all"><small>Razem przed ekranem</small><b>${fmtDur(tvMin + mvMin)}</b><span>${(tvMin + mvMin) / 1440 >= 1 ? `to ${((tvMin + mvMin) / 1440).toFixed(1).replace('.', ',')} doby bez przerwy` : 'od początku korzystania z aplikacji'} · ${plural(finished, 'serial ukończony', 'seriale ukończone', 'seriali ukończonych')}</span></div>
    </div>
    ${years.length ? `<div class="pills years">${years.map(y => `<a data-act="statYear" data-y="${y}" class="${y === statsYear ? 'on' : ''}">${y}</a>`).join('')}</div>` : ''}
    <div class="panel ysum">
      <div><b>${yEps.length}</b><small>odcinków</small></div><div><b>${yFilms.length}</b><small>filmów</small></div>
      <div><b>${fmtDur(epMin.reduce((a, b) => a + b, 0) + mvMinM.reduce((a, b) => a + b, 0))}</b><small>w ${statsYear}</small></div>
    </div>
    <div class="panel">
      <div class="ptitle"><span><i class="dot tv"></i>Odcinki w miesiącach</span></div>${chart(epM, 'tv', n => plural(n, 'odcinek', 'odcinki', 'odcinków'))}
      <div class="ptitle" style="margin-top:16px"><span><i class="dot mv"></i>Filmy w miesiącach</span></div>${chart(mvM, 'mv', n => plural(n, 'film', 'filmy', 'filmów'))}
      ${sel}
    </div>
    ${top.length ? `<h2>Najczęściej oglądane w ${statsYear}</h2><div class="panel">${top.map(([id, n], i) => `<a class="toprow" href="#/show/${id}"><span class="rk">${i + 1}</span><span class="nm">${esc(showName(id))}</span><span class="muted small">${plural(n, 'odcinek', 'odcinki', 'odcinków')}</span></a>`).join('')}</div>` : ''}
    <h2>Miesiąc po miesiącu</h2>
    <div class="panel"><table class="mtable"><thead><tr><th>Miesiąc</th><th>Odcinki</th><th>Filmy</th><th>Czas</th></tr></thead><tbody>
      ${MONTHS_FULL.map((n, i) => (epM[i] || mvM[i]) ? `<tr><td>${n}</td><td>${epM[i]}</td><td>${mvM[i]}</td><td>${fmtDur(epMin[i] + mvMinM[i])}</td></tr>` : '').join('') || '<tr><td colspan="4" class="muted">Brak obejrzanych w tym roku</td></tr>'}
    </tbody></table></div>
    <p class="src">Czas liczony z długości odcinków i filmów. Odcinki oznaczone hurtem („obejrzane wszystko”) liczą się do miesiąca, w którym je zaznaczono.</p>`;
}

let selMode = null;            // klucz listy, na której zaznaczamy kilka pozycji

function libSets() {
  const shows = Object.values(state.shows).map(s => {
    const d = showCache[s.id], aired = d ? d.episodes.filter(counts) : [], done = aired.filter(e => state.watched[e.key]).length;
    return { s, d, done, aired: aired.length };
  });
  const active = shows.filter(x => !x.s.dropped), movies = Object.values(state.movies);
  return {
    'watching': ['Oglądam', 'tv', active.filter(x => x.done > 0 && x.done < x.aired)],
    'later-tv': ['Seriale na później', 'tv', active.filter(x => x.done === 0 && x.aired > 0)],
    'done-tv': ['Seriale obejrzane', 'tv', active.filter(x => x.aired > 0 && x.done === x.aired)],
    'dropped': ['Przerwane', 'tv', shows.filter(x => x.s.dropped)],

function libItem(type, x, sel) {

  const name = type === 'tv' ? x.s.name : x.title;

  const rating = type === 'tv' ? x.s.rating : type === 'movie' ? x.rating : 0;
  const sub = type === 'tv' ? (x.aired ? `${x.done}/${x.aired} odc.` : '')

  const lock = sel && type === 'movie' && movieUnreleased(x.id);

  return sel ? `<div class="mini ${selected.has(k) ? 'picked' : ''} ${lock ? 'lock' : ''}" data-act="${lock ? 'selLocked' : 'selToggle'}" data-k="${k}" data-name="${esc(name.toLowerCase())}">${inner}</div>`
    : `<a class="mini" href="${href}" data-name="${esc((name || '').toLowerCase())}">${inner}</a>`;
}

document.addEventListener('change', async ev => {
  if (ev.target.id !== 'avatarFile' || !ev.target.files[0]) return;
  try {
    const url = URL.createObjectURL(ev.target.files[0]);
    const im = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = url; });
    const s = Math.min(im.naturalWidth, im.naturalHeight), c = document.createElement('canvas');
    c.width = c.height = 256;
    c.getContext('2d').drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, 256, 256);
    URL.revokeObjectURL(url);
    (state.prefs ||= {}).avatar = c.toDataURL('image/jpeg', .84);
    save(); toast('Zapisano zdjęcie profilowe'); rerender();
  } catch (e) { toast('Nie udało się wczytać tego zdjęcia'); }
});

    all[k] = { type: kind, id, title: x.name || x.title || '', poster: img(x.poster_path), genres: gn, rel: [...new Set(rel)].slice(0, 40), t: Date.now() };

    if (all[key]) { delete all[key]; save(); toast('Kategoria znowu pojawi się w propozycjach'); rerender(); return; }
    let rule;
    if (key === 'polish') rule = { polish: true };
    else {
      const c = EXTRA_CATS[d.kind].find(x => 'x' + x[0] === key), pr = c[3];
      if (pr.with_original_language) rule = { lang: pr.with_original_language, genres: pr.with_genres ? pr.with_genres.split(',').map(Number) : [] };

  const tvMins = w.reduce((a, x) => a + (x.m || 0) * (1 + (x.rw || []).length), 0), movieMins = seenM.reduce((a, m) => a + (m.runtime || 0) * (1 + (m.rw || []).length), 0);

const hexHsl = hex => {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, Math.round(l * 100)];
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [Math.round((h * 60 + 360) % 360), Math.round(s * 100), Math.round(l * 100)];
};
const themeOf = () => THEMES.find(x => x[0] === document.documentElement.dataset.theme) || THEMES[0];
// wartości startowe suwaków = kolory aktualnego motywu
function lookDefaults() {
  const th = themeOf(), [ah, as] = hexHsl(th[4]), [bh, bs] = hexHsl(th[2]);
  return { ah, as, bh, bs: Math.min(bs, 60), bl: 0 };
}
const LOOK_VARS = ['--accent', '--accent-ink', '--accent-soft', '--bg', '--card', '--card2', '--line'];
function applyLook(c) {
  const st = document.documentElement.style;
  if (!c) { LOOK_VARS.forEach(v => st.removeProperty(v)); return; }
  const dark = !!themeOf()[5], cl = (x, a, b) => Math.max(a, Math.min(b, x));
  const hsl = (h, s, l) => `hsl(${h} ${cl(s, 0, 100)}% ${cl(l, 0, 100)}%)`;
  st.setProperty('--accent', hsl(c.ah, c.as, dark ? 64 : 47));
  st.setProperty('--accent-ink', hsl(c.ah, c.as, dark ? 74 : 36));
  st.setProperty('--accent-soft', hsl(c.ah, c.as * (dark ? .35 : .6), dark ? 22 : 91));
  st.setProperty('--bg', hsl(c.bh, c.bs * (dark ? .5 : 1), (dark ? 10 : 95) + c.bl));
  st.setProperty('--card', hsl(c.bh, c.bs * (dark ? .5 : .7), (dark ? 14 : 99) + c.bl / (dark ? 1 : 4)));
  st.setProperty('--card2', hsl(c.bh, c.bs * (dark ? .5 : 1), (dark ? 18 : 90) + c.bl));
  st.setProperty('--line', hsl(c.bh, c.bs * (dark ? .45 : .8), (dark ? 24 : 85) + c.bl));
}
function setLook(c, persist) {
  applyLook(c);
  try { c ? localStorage.setItem('serialog.look', JSON.stringify(c)) : localStorage.removeItem('serialog.look'); } catch (e) {}
  if (persist && user) { (state.prefs ||= {}).look = c || null; save(); }
}
const LOOK_SLIDERS = [
  ['ah', 'Kolor akcentu', 0, 359, 'przyciski, paski, wyróżnienia'], ['as', 'Natężenie akcentu', 10, 100, 'od stonowanego do żywego'],
  ['bh', 'Kolor tła', 0, 359, 'odcień tła i kart'], ['bs', 'Natężenie tła', 0, 60, 'od neutralnego do kolorowego'],
  ['bl', 'Jasność tła', -6, 6, 'ciemniej ← → jaśniej'],
];
function openLook() {
  const cur = (state.prefs && state.prefs.look) || null, c = cur || lookDefaults(), th = themeOf()[0];
  $('#sheet').innerHTML = `<div class="look">
    <div class="look-head"><b>Dostosuj wygląd</b><button class="x" data-act="close" title="Zamknij">✕</button></div>
    <div class="lprev" aria-hidden="true"><div class="lp-bg">
      <div class="lp-top"><b>Sean<span>sik</span></b><small>podgląd</small></div>
      <div class="lp-card"><span class="lp-poster"></span><div class="lp-body"><b>Twój serial</b><small>S02E05 · za 3 dni</small><span class="lp-bar"><i></i></span></div><span class="lp-chk">✓</span></div>
      <div class="lp-row"><span class="lp-btn">✓ Obejrzany</span><span class="lp-ghost">＋ Na później</span><span class="lp-chip">Dramat</span></div>
      <div class="lp-tabs"><i class="on"></i><i></i><i></i><i></i><i></i></div>
    </div></div>
    <div class="muted small" style="margin:4px 0 8px">1. Wybierz motyw</div>
    <div class="themes">${THEMES.map(([k, n, bg, card, acc]) => `<a class="th ${th === k ? 'on' : ''}" data-act="theme" data-v="${k}">
      <span class="sw" style="background:${bg}"><u style="background:${card}"></u><i style="background:${acc}"></i></span>${n}</a>`).join('')}</div>
    <div class="muted small" style="margin:16px 0 4px">2. Dopasuj kolory ${cur ? '<span class="tag">własne</span>' : ''}</div>
    ${LOOK_SLIDERS.map(([k, label, min, max, hint]) => `<label class="slider ${k === 'ah' || k === 'bh' ? 'hue' : ''}">
      <span class="sl-top"><b>${label}</b><small>${hint}</small></span>
      <input type="range" min="${min}" max="${max}" step="1" value="${c[k]}" data-k="${k}"></label>`).join('')}
    <div class="actions" style="margin:16px 0 0">
      <button class="btn" data-act="close">Gotowe</button>
      ${cur ? '<button class="btn ghost" data-act="lookReset">Przywróć kolory motywu</button>' : ''}
    </div></div>`;
  $('#sheetWrap').classList.remove('hidden');
  const read = () => { const o = { ...c }; document.querySelectorAll('.look input[type=range]').forEach(i => o[i.dataset.k] = +i.value); return o; };
  // suwaki pokazują kolory, na które się zmieni (np. natężenie: od szarego do pełnego koloru)
  const paint = o => {
    const tr = { as: `linear-gradient(90deg,hsl(${o.ah} 10% 50%),hsl(${o.ah} 100% 47%))`, bs: `linear-gradient(90deg,hsl(${o.bh} 0% 92%),hsl(${o.bh} 60% 88%))`,
      bl: `linear-gradient(90deg,hsl(${o.bh} ${o.bs}% 82%),hsl(${o.bh} ${o.bs}% 99%))` };
    document.querySelectorAll('.look input[type=range]').forEach(i => { if (tr[i.dataset.k]) { i.style.background = tr[i.dataset.k]; i.classList.add('trk'); } });
  };
  paint(c);
  document.querySelectorAll('.look input[type=range]').forEach(i => {
    i.oninput = () => { const o = read(); applyLook(o); paint(o); };   // podgląd na żywo
    i.onchange = () => { setLook(read(), true); };      // zapis po puszczeniu suwaka
  });
}
try { setTheme(localStorage.getItem('serialog.theme')); } catch (e) { setTheme('cream'); }
try { applyLook(JSON.parse(localStorage.getItem('serialog.look') || 'null')); } catch (e) {}
function updateTodayDot() {
  const today = todayStr();
  const n = Object.keys(state.shows).filter(id => showCache[id] && upShow(showCache[id])).reduce((a, id) => a + showCache[id].episodes.filter(e => e.air === today && !state.watched[e.key]).length, 0);
  const dot = $('#todayDot'); dot.hidden = !n; dot.textContent = n;
}
async function boot() {
  try {
    const cfg = await fetch('/api/config', { cache: 'no-store' }).then(r => r.ok ? r.json() : null);
    if (cfg) {
      mode = 'account'; hasTmdb = cfg.tmdb;
      const r = await fetch('/api/me', { cache: 'no-store' });
      if (r.status === 200) { user = (await r.json()).username; if (hasTmdb) await afterLogin(); }
    }
  } catch (e) { /* brak serwera (plik otwarty z dysku) */ }
  render();
}
boot();
